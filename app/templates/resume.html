{% extends "layout.html" %}
{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Applicant Resume
        </h2>

        <div class="text-center">

            <a href="{{ url_for('static', filename=cv) }}"
               target="_blank"
               class="btn btn-success btn-lg">

                📄 Open Resume

            </a>

            <br><br>

            <a href="{{ url_for('static', filename=cv) }}"
               download
               class="btn btn-primary">

                ⬇ Download Resume

            </a>

            <br><br>

            <a href="/meeting/{{id}}"
               class="btn btn-warning">

                🎤 Start Interview

            </a>

        </div>

    </div>

</div>

{% endblock %}
