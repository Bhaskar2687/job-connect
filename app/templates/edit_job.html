{% extends "layout.html" %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-dark text-white">

                    <h3 class="mb-0">
                        Edit Job
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="form-group">
                            <label>Job Title</label>
                            <input type="text"
                                   class="form-control"
                                   name="title"
                                   value="{{ job.title }}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Company Name</label>
                            <input type="text"
                                   class="form-control"
                                   name="company_name"
                                   value="{{ job.company_name }}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Industry</label>
                            <input type="text"
                                   class="form-control"
                                   name="industry"
                                   value="{{ job.industry }}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Location</label>
                            <input type="text"
                                   class="form-control"
                                   name="location"
                                   value="{{ job.location }}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Experience</label>
                            <input type="text"
                                   class="form-control"
                                   name="experience"
                                   value="{{ job.experience }}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Job Type</label>
                            <input type="text"
                                   class="form-control"
                                   name="job_type"
                                   value="{{ job.job_type }}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Description</label>

                            <textarea
                                class="form-control"
                                rows="6"
                                name="description"
                                required>{{ job.description }}</textarea>

                        </div>

                        <div class="form-group">
                            <label>Career Link</label>

                            <input type="url"
                                   class="form-control"
                                   name="apply_link"
                                   value="{{ job.apply_link }}"
                                   required>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('admin_job_details', job_id=job.id) }}"
                               class="btn btn-secondary">

                                Back

                            </a>

                            <button type="submit"
                                    class="btn btn-success">

                                <i class="fas fa-save"></i>

                                Update Job

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
