{% extends "layout.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="font-weight-bold">All Jobs</h2>
    <hr>

    <!-- Search -->
    <div class="row mb-4">
        <div class="col-md-6">
            <input
                type="text"
                id="searchJob"
                class="form-control"
                placeholder="🔍 Search Job">
        </div>
    </div>

    <div class="card shadow-sm border-0">

        <div class="table-responsive">

            <table class="table table-hover mb-0" id="jobsTable">

                <thead class="thead-dark">

                    <tr>
                        <th>Job Title</th>
                        <th>Industry</th>
                        <th>Posted On</th>
                        <th width="120">Action</th>
                    </tr>

                </thead>

                <tbody>

                {% for job in jobs %}

                    <tr>

                        <td>{{ job.title }}</td>

                        <td>{{ job.industry }}</td>

                        <td>{{ job.date_posted.strftime('%d %b %Y') }}</td>

                        <td>

                            <a href="{{ url_for('admin_job_details', job_id=job.id) }}"
                               class="btn btn-sm btn-outline-dark">

                                <i class="fas fa-eye"></i>
                                View

                            </a>

                        </td>

                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

document.getElementById("searchJob").addEventListener("keyup", function(){

    let value=this.value.toLowerCase();

    let rows=document.querySelectorAll("#jobsTable tbody tr");

    rows.forEach(function(row){

        row.style.display=row.innerText.toLowerCase().includes(value)
            ? ""
            : "none";

    });

});

</script>

{% endblock %}
