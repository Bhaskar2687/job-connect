<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobConnect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            padding:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#6c757d,#495057);
            font-family:Arial, Helvetica, sans-serif;
        }
        
        .card-box{
                    background:#f8f9fa;
                    padding:60px;
                    border-radius:20px;
                    text-align:center;
                    box-shadow:0 12px 30px rgba(0,0,0,.25);
                    width:500px;
        }

        h1{
            font-weight:bold;
            color:#1e3a8a;
        }

        p{
            color:#666;
            margin:20px 0 35px;
            font-size:18px;
        }

        .btn{
            width:170px;
            padding:12px;
            font-size:18px;
            border-radius:30px;
        }
    </style>

</head>

<body>

<div class="card-box">

    <h1>Welcome to JobConnect</h1>

    <p>Find your dream job with one click.</p>

    <a href="{{ url_for('login') }}" class="btn btn-primary mr-3">
        Login
    </a>

    <a href="{{ url_for('register') }}" class="btn btn-success">
        Sign Up
    </a>

</div>

</body>
</html>
